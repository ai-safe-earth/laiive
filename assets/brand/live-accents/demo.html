<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>laiive · live accents demo</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500&family=IBM+Plex+Mono:wght@500&display=swap">
<link rel="stylesheet" href="live-accents.css">
<style>
  .live-mark{--live-mask:url(mask-mark.png)} .live-saved{--live-mask:url(mask-saved.svg)}
  html,body{margin:0;height:100%;background:#0C0A0A;color:#F4EDE2;font-family:'DM Sans',sans-serif}
  main{max-width:430px;margin:0 auto;height:100dvh;box-sizing:border-box;padding:22px 20px 18px;display:flex;flex-direction:column}
  header{display:flex;justify-content:space-between;align-items:center}
  .lock{display:flex;gap:9px;align-items:center;font:400 24px/1 'Bebas Neue';letter-spacing:.03em}
  h1{font:400 60px/.86 'Bebas Neue';margin:0;letter-spacing:.02em}
  .card{display:flex;justify-content:space-between;align-items:center;background:#241B1B;border:1px solid rgba(255,255,255,.07);border-radius:20px;padding:12px 14px}
  .chip{font:500 11px/1 'IBM Plex Mono';letter-spacing:.08em;color:#0C0A0A;border-radius:999px;padding:7px 11px}
  .composer{display:flex;gap:10px;margin-top:auto}
  .input{flex:1;height:46px;box-sizing:border-box;background:#171313;border:1px solid #2E2222;border-radius:999px;display:flex;align-items:center;padding:0 18px;color:#A79797}
  .send{width:46px;height:46px;border-radius:999px;display:flex;align-items:center;justify-content:center}
</style></head>
<body><main>
  <header><div class="lock"><div class="live-accent live-accent--mask live-mark" style="width:30px;height:30px"></div>LAIIVE</div>
    <div class="live-accent live-accent--mask live-saved" style="width:22px;height:22px"></div></header>
  <div style="display:flex;justify-content:center;padding:34px 0 18px"><div class="live-accent live-accent--mask live-mark" style="width:150px;height:150px"></div></div>
  <h1>WHAT'S ON<br><span class="live-accent live-accent--text" style="display:inline-block">TONIGHT</span></h1>
  <p>Three rooms worth leaving the house for tonight.</p>
  <div class="card"><div><div style="font-weight:500;color:#fff">Sala Volaeri</div><div style="font-size:12px;color:#B5A6A6">22:00 · 0.8 km</div></div><span class="live-accent chip">FREE</span></div>
  <div class="composer"><div class="input">what's on tonight?</div>
    <button class="live-accent send" style="border:0" aria-label="Send"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#0C0A0A" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12l16-7-7 16-2-7z"/></svg></button></div>
</main>
<script>
  // same logic as useLiveAccents.ts
  let raf=0;const sync=()=>{raf=0;document.querySelectorAll('.live-accent').forEach(el=>{const r=el.getBoundingClientRect();el.style.setProperty('--hx',r.left+'px');el.style.setProperty('--hy',r.top+'px')})};
  const s=()=>{if(!raf)raf=requestAnimationFrame(sync)};s();addEventListener('resize',s);addEventListener('scroll',s,true);document.fonts.ready.then(s);
</script>
</body></html>
