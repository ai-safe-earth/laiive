# Formatters, linters and the secret scan, over the whole tree.
# `ci.yml` stays separate: it is the expensive half (tests, images).
name: pre-commit

on:
  # Long-lived branches only: a work branch is covered by its PR, and running
  # both doubled every check on every push.
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

concurrency:
  group: pre-commit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0            # let pre-commit diff correctly

      - uses: actions/setup-python@v5
        with:
          # Pinned, not '3.x': the services target 3.13, and a floating runtime
          # drifts onto an interpreter the hook environments have no wheels for.
          python-version: "3.13"

      # Runs every pre-commit-stage hook over --all-files and fails if any of
      # them rewrites a file, so no extra "check for unstaged changes" step.
      - uses: pre-commit/action@v3.0.1

  # The commit-msg hook only fires on `git commit`, so nothing on the server
  # ever saw a message until now. `cz check` re-reads the PR's own commits.
  # CONTRIBUTING.md makes the bodies the reasoning — this keeps them parseable
  # by `cz bump`, which is what writes CHANGELOG.md at release.
  commit-lint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install "commitizen==4.18.0"
      - name: cz check
        run: |
          cz check --rev-range \
            "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
