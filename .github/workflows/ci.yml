# Every merge is tested and every image builds (04-plan Phase 6).
# `pre-commit.yml` stays separate: it is cheap, independent, and formats.
name: ci

on:
  # Long-lived branches only: a work branch is covered by its PR, and running
  # both doubled every check on every push.
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    # Match the python:3.13-slim images. The old reason for pinning (langfuse's
    # pydantic-v1 shim broke on 3.14) died with the Phoenix migration; matching
    # the runtime images is reason enough on its own, so the pin stays.
    env:
      UV_PYTHON: "3.13"
    strategy:
      fail-fast: false
      matrix:
        # Each service is its own uv project — there is no root pyproject.
        service: [shared, retriever, pusher, search]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: services/${{ matrix.service }}/uv.lock
      - name: sync
        working-directory: services/${{ matrix.service }}
        run: uv sync --locked
      - name: ruff
        working-directory: services/${{ matrix.service }}
        run: uv run ruff check .
      - name: pytest
        working-directory: services/${{ matrix.service }}
        # Integration tests need a live Aura and real keys; they are deselected
        # here and run by hand (see the verify-retriever skill).
        # The configs fail loudly on missing keys and there is no .env in CI;
        # the unit suites mock every client, so dummies satisfy them.
        env:
          NEO4J_URI: bolt://localhost:7687
          NEO4J_USERNAME: neo4j
          NEO4J_PASSWORD: ci-dummy # pragma: allowlist secret
          OPENAI_API_KEY: sk-ci-dummy # pragma: allowlist secret
          TAVILY_API_KEY: tvly-ci-dummy # pragma: allowlist secret
          SUPABASE_URL: https://ci-dummy.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ci-dummy # pragma: allowlist secret
        run: uv run pytest -q -m "not integration"

  # The retrieval and cypher eval suites, against a real Neo4j.
  #
  # Its own job rather than a service on the matrix above: only the retriever
  # needs a database, and hanging one off all four services would pay for it
  # four times. No OpenAI key here — the fixture's vectors are frozen in the
  # dataset, so the whole tier is free and deterministic. The half of the
  # cypher corpus that also needs a live generation is `integration` as well,
  # so it is deselected here and runs in evals-weekly.yml.
  graph:
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.13"
    services:
      neo4j:
        image: neo4j:5.26-community
        ports:
          - 7689:7687
        env:
          NEO4J_AUTH: neo4j/laiive-test-graph # pragma: allowlist secret
          NEO4J_server_memory_heap_max__size: 512m
        options: >-
          --health-cmd "cypher-shell -u neo4j -p laiive-test-graph 'RETURN 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: services/retriever/uv.lock
      - name: sync
        working-directory: services/retriever
        run: uv sync --locked
      - name: pytest (graph tier)
        working-directory: services/retriever
        env:
          # config.py fails loudly on missing keys; nothing here calls OpenAI.
          NEO4J_URI: bolt://localhost:7689
          NEO4J_USERNAME: neo4j
          NEO4J_PASSWORD: ci-dummy # pragma: allowlist secret
          OPENAI_API_KEY: sk-ci-dummy # pragma: allowlist secret
          SUPABASE_URL: https://ci-dummy.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ci-dummy # pragma: allowlist secret
        # A skip here would be silent and permanent, so the container being
        # reachable is asserted before the suites that would skip without it.
        run: |
          uv run --no-sync python -c "from tests import graph_fixture; assert graph_fixture.reachable(), 'no test graph'"
          uv run --no-sync pytest -q -m "graph and not integration"

  node:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { dir: services/gateway, test: true }
          - { dir: frontend, test: true }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ${{ matrix.dir }}/package-lock.json
      - working-directory: ${{ matrix.dir }}
        run: npm ci
      - name: typecheck
        working-directory: ${{ matrix.dir }}
        # The frontend's typecheck runs both tsconfig projects; a bare
        # `tsc --noEmit` at its root is a silent no-op with project references.
        run: npm run typecheck
      - name: lint
        working-directory: ${{ matrix.dir }}
        run: npm run lint
      - name: test
        if: matrix.test
        working-directory: ${{ matrix.dir }}
        run: npm test
      - name: build
        working-directory: ${{ matrix.dir }}
        run: npm run build

  images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [gateway, retriever, pusher, search]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: build
        uses: docker/build-push-action@v6
        with:
          # Context is services/ for all four: the Python images COPY shared/
          # alongside their own directory.
          context: ./services
          file: ./services/${{ matrix.service }}/Dockerfile
          push: false
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  # The single check the branch rulesets require. Requiring the matrix jobs
  # directly means the ruleset holds eleven strings like
  # "node (services/gateway, true)" — rename one matrix entry and the required
  # check simply never reports, and the PR hangs on a context that no longer
  # exists. This job's name is stable; the matrix underneath it is free to move.
  #
  # `if: always()` so it still runs when a dependency failed — without it the
  # job is skipped, and a skipped required check reads as success.
  ci-ok:
    if: always()
    needs: [python, graph, node, images]
    runs-on: ubuntu-latest
    steps:
      - name: verify
        run: |
          echo "python: ${{ needs.python.result }}"
          echo "graph:  ${{ needs.graph.result }}"
          echo "node:   ${{ needs.node.result }}"
          echo "images: ${{ needs.images.result }}"
          [ "${{ needs.python.result }}" = "success" ] \
            && [ "${{ needs.graph.result }}" = "success" ] \
            && [ "${{ needs.node.result }}" = "success" ] \
            && [ "${{ needs.images.result }}" = "success" ]
