# Every merge is tested and every image builds (04-plan Phase 6).
# `pre-commit.yml` stays separate: it is cheap, independent, and formats.
name: ci

on:
  # Long-lived branches only: a work branch is covered by its PR, and running
  # both doubled every check on every push.
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    # Match the python:3.13-slim images. Without a pin uv grabs the newest
    # interpreter (3.14 today), where langfuse's pydantic-v1 shim breaks.
    env:
      UV_PYTHON: "3.13"
    strategy:
      fail-fast: false
      matrix:
        # Each service is its own uv project — there is no root pyproject.
        service: [shared, retriever, pusher, search]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: services/${{ matrix.service }}/uv.lock
      - name: sync
        working-directory: services/${{ matrix.service }}
        run: uv sync --locked
      - name: ruff
        working-directory: services/${{ matrix.service }}
        run: uv run ruff check .
      - name: pytest
        working-directory: services/${{ matrix.service }}
        # Integration tests need a live Aura and real keys; they are deselected
        # here and run by hand (see the verify-retriever skill).
        # The configs fail loudly on missing keys and there is no .env in CI;
        # the unit suites mock every client, so dummies satisfy them.
        env:
          NEO4J_URI: bolt://localhost:7687
          NEO4J_USERNAME: neo4j
          NEO4J_PASSWORD: ci-dummy # pragma: allowlist secret
          OPENAI_API_KEY: sk-ci-dummy # pragma: allowlist secret
          TAVILY_API_KEY: tvly-ci-dummy # pragma: allowlist secret
          SUPABASE_URL: https://ci-dummy.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ci-dummy # pragma: allowlist secret
        run: uv run pytest -q -m "not integration"

  node:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { dir: services/gateway, test: true }
          - { dir: frontend, test: true }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ${{ matrix.dir }}/package-lock.json
      - working-directory: ${{ matrix.dir }}
        run: npm ci
      - name: typecheck
        working-directory: ${{ matrix.dir }}
        # The frontend's typecheck runs both tsconfig projects; a bare
        # `tsc --noEmit` at its root is a silent no-op with project references.
        run: npm run typecheck
      - name: lint
        working-directory: ${{ matrix.dir }}
        run: npm run lint
      - name: test
        if: matrix.test
        working-directory: ${{ matrix.dir }}
        run: npm test
      - name: build
        working-directory: ${{ matrix.dir }}
        run: npm run build

  images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [gateway, retriever, pusher, search]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: build
        uses: docker/build-push-action@v6
        with:
          # Context is services/ for all four: the Python images COPY shared/
          # alongside their own directory.
          context: ./services
          file: ./services/${{ matrix.service }}/Dockerfile
          push: false
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  # The single check the branch rulesets require. Requiring the matrix jobs
  # directly means the ruleset holds eleven strings like
  # "node (services/gateway, true)" — rename one matrix entry and the required
  # check simply never reports, and the PR hangs on a context that no longer
  # exists. This job's name is stable; the matrix underneath it is free to move.
  #
  # `if: always()` so it still runs when a dependency failed — without it the
  # job is skipped, and a skipped required check reads as success.
  ci-ok:
    if: always()
    needs: [python, node, images]
    runs-on: ubuntu-latest
    steps:
      - name: verify
        run: |
          echo "python: ${{ needs.python.result }}"
          echo "node:   ${{ needs.node.result }}"
          echo "images: ${{ needs.images.result }}"
          [ "${{ needs.python.result }}" = "success" ] \
            && [ "${{ needs.node.result }}" = "success" ] \
            && [ "${{ needs.images.result }}" = "success" ]
