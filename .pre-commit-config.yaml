# See https://pre-commit.com
#
# Hook types: the commit-msg hook was missing from `.git/hooks` for months, so
# commitizen never validated a single message. `default_install_hook_types`
# makes a bare `pre-commit install` wire up both, on every clone.
default_install_hook_types: [pre-commit, commit-msg]

repos:
  #######################################################################
  # 1. House-keeping & "always on" fixers
  #######################################################################
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0          # pin to published tag
    hooks:
      - id: check-toml
      - id: check-yaml
        # k8s manifests are multi-document files
        args: ["--allow-multiple-documents"]
      - id: check-json
        # tsconfig files are JSONC (comments allowed) — not parseable as strict JSON
        exclude: "tsconfig.*\\.json$|\\.vscode/"
      - id: check-added-large-files
        # The pro walkthrough video is product media the SPA serves; it is the
        # one deliberate exception to the 500 KB ceiling.
        exclude: "^frontend/public/pro-walkthrough\\.mp4$"
      - id: end-of-file-fixer
        exclude: "^frontend/(dist|public)/|\\.svg$"
      - id: trailing-whitespace
        exclude: "^frontend/dist/"
      - id: check-merge-conflict
      # Dev is Windows, CI is Linux: two files differing only in case commit
      # fine here and collide on checkout there.
      - id: check-case-conflict
      - id: detect-private-key
      # No `mixed-line-ending` here. `core.autocrlf=true` on the dev box already
      # stores LF and checks out CRLF, so `--fix=lf` rewrites the whole worktree
      # against git's own filter — 222 phantom-modified files on every run, and
      # a silent no-op on the all-LF Linux runner. `.gitattributes` is the place
      # to force an ending, and it already does for *.sh.

  #######################################################################
  # 2. Ruff: lint *then* format, one pass, auto-fix on commit
  #######################################################################
  # Held at 0.4.9 deliberately: the four services pin `ruff==0.4.9` in their
  # pyproject so CI (`uv run ruff check`) and this hook agree. Bumping means
  # four pyprojects, four relocks and whatever new rules fire — its own PR.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.9
    hooks:
      # Linter must run *before* the formatter when --fix is enabled
      # see Ruff docs on ordering
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix, --show-fixes]
        files: "^services/(retriever|pusher|shared|search)/.*\\.py$"
      - id: ruff-format
        files: "^services/(retriever|pusher|shared|search)/.*\\.py$"

  #######################################################################
  # 3. Static typing
  #######################################################################
  # One mypy hook per service: retriever, pusher and search each have a top-level
  # `agent` package, and a single invocation spanning two of them dies on
  # "Duplicate module named agent" — which only surfaces on commits that touch
  # several services at once.
  #
  # Held in the 1.x line: mypy 2.x is a major release and this is a lint gate on
  # every commit, not a migration project.
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.20.2
    hooks:
      - id: mypy
        alias: mypy-retriever
        name: mypy (retriever)
        additional_dependencies: ["types-requests"]
        args: ["--ignore-missing-imports", "--no-strict-optional"]
        files: "^services/retriever/.*\\.py$"
      - id: mypy
        alias: mypy-pusher
        name: mypy (pusher)
        additional_dependencies: ["types-requests"]
        args: ["--ignore-missing-imports", "--no-strict-optional"]
        files: "^services/pusher/.*\\.py$"
      - id: mypy
        alias: mypy-search
        name: mypy (search)
        additional_dependencies: ["types-requests"]
        args: ["--ignore-missing-imports", "--no-strict-optional"]
        files: "^services/search/.*\\.py$"
      - id: mypy
        alias: mypy-shared
        name: mypy (shared)
        # types-redis: shared lazily imports redis in geocode_store
        additional_dependencies: ["types-requests", "types-redis"]
        args: ["--ignore-missing-imports", "--no-strict-optional"]
        files: "^services/shared/.*\\.py$"

  #######################################################################
  # 4. Security & supply-chain
  #######################################################################
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      # pre-commit only: the pre-push stage was never installed, and when it is
      # it rescans the whole tree on every push for no extra coverage.
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline"]

  #######################################################################
  # 5. SQL linting for Postgres migrations & seed scripts
  #######################################################################
  # Held at 3.x: sqlfluff 4 reshuffles the rule set and the migrations are
  # applied history — reformatting them is not a hook's decision.
  - repo: https://github.com/sqlfluff/sqlfluff
    rev: 3.4.2
    hooks:
      - id: sqlfluff-lint
        args: ["--dialect", "postgres"]
        files: "^supabase/migrations/.*\\.sql$"

  #######################################################################
  # 6. Conventional Commit enforcement
  #######################################################################
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.18.0
    hooks:
      - id: commitizen
        stages: [commit-msg]  # validates on commit, no CI surprises
