# laiive gateway — the only public surface (compose parity: only published port).
# Deploy: make fly-deploy-gateway (build context must be services/, see Makefile).
# Secrets (fly secrets set): SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY,
# SUPABASE_SERVICE_ROLE_KEY, INTERNAL_API_KEY, CORS_ALLOW_ORIGINS — see DEPLOY.md.
app = "laiive-gateway"
primary_region = "fra"
kill_timeout = 30

[env]
  # "::" binds dual-stack so 6PN (IPv6-only) and the Fly proxy both reach it.
  GATEWAY_HOST = "::"
  RETRIEVER_URL = "http://laiive-retriever.internal:8002"
  PUSHER_URL = "http://laiive-pusher.internal:8003"
  SEARCH_URL = "http://laiive-search.internal:8004"
  REDIS_URL = "redis://laiive-redis.internal:6379/0"
  SEARCH_ENABLED = "true"

[http_service]
  internal_port = 8000
  force_https = true
  # Always on: SSE chats and admin sweeps must not race machine autostop.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "20s"
    timeout = "5s"
    grace_period = "15s"
    method = "GET"
    path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
