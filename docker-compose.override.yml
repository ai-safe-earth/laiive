# development
#
# The three Python services here are idle `sleep infinity` shells you exec into,
# not running APIs. Two consequences of the hardened images (D19 phase B):
#   - they build the `build` stage, because the runtime stage has no uv;
#   - their healthchecks are disabled, since nothing is listening — and the
#     gateway's `depends_on` conditions are relaxed to match, or `up-dev` waits
#     forever for a service that will never report healthy.
services:
  gateway:
    depends_on:
      redis:
        condition: service_started
      retriever:
        condition: service_started
      pusher:
        condition: service_started
      search:
        condition: service_started

  pusher:
    container_name: laiive-pusher
    build:
      context: ./services
      dockerfile: pusher/Dockerfile
      target: build
    healthcheck:
      disable: true
    volumes:
      - ./services/pusher:/app:cached
      - ./services/shared:/shared:cached
      - pusher-venv:/app/.venv
    tty: true
    stdin_open: true
    environment:
      UV_LINK_MODE: copy
    command: ["sleep", "infinity"]
    develop:
      watch:
        - action: sync
          path: ./services/pusher
          target: /app
          ignore:
            - .venv/

  retriever:
    container_name: laiive-retriever
    build:
      context: ./services
      dockerfile: retriever/Dockerfile
      target: build
    healthcheck:
      disable: true
    volumes:
      - ./services/retriever:/app:cached
      - ./services/shared:/shared:cached
      - retriever-venv:/app/.venv
    tty: true
    stdin_open: true
    environment:
      UV_LINK_MODE: copy
    command: ["sleep", "infinity"]
    develop:
      watch:
        - action: sync
          path: ./services/retriever
          target: /app
          ignore:
            - .venv/

  search:
    container_name: laiive-search
    build:
      context: ./services
      dockerfile: search/Dockerfile
      target: build
    healthcheck:
      disable: true
    volumes:
      - ./services/search:/app:cached
      - ./services/shared:/shared:cached
      - search-venv:/app/.venv
    tty: true
    stdin_open: true
    environment:
      UV_LINK_MODE: copy
    command: ["sleep", "infinity"]
    develop:
      watch:
        - action: sync
          path: ./services/search
          target: /app
          ignore:
            - .venv/

  # Trace collector for the Python services, replacing Langfuse. Published on
  # purpose, against this project's "only the gateway is published" rule: it is
  # the one service here with a UI a human opens, and in dev the Python services
  # run natively on the host (the containers above are sleep-infinity shells),
  # so http://localhost:6006 is the address they actually send to.
  #
  # Not in docker-compose.yml: production traces go to a collector outside this
  # compose project, named by PHOENIX_COLLECTOR_ENDPOINT.
  #
  # ponytail: :latest and the bundled SQLite, which is right for a local scratch
  # collector - traces are disposable and re-runnable. Pin the tag and move to
  # PHOENIX_SQL_DATABASE_URL (Postgres >= 14) if this ever holds a history
  # anyone reasons from.
  phoenix:
    container_name: laiive-phoenix
    image: arizephoenix/phoenix:latest
    ports:
      - "6006:6006"   # UI + OTLP/HTTP collector — the one the services use
      - "4317:4317"   # OTLP/gRPC collector
    environment:
      PHOENIX_WORKING_DIR: /mnt/data
    volumes:
      - phoenix-data:/mnt/data
    restart: unless-stopped

volumes:
  pusher-venv:
  retriever-venv:
  search-venv:
  phoenix-data:
