<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0C0A0A" />

    <link rel="icon" type="image/png" href="/brand/appicon-1024-cream-on-fuchsia.png" />
    <link rel="apple-touch-icon" href="/brand/appicon-1024-cream-on-fuchsia.png" />
    <!-- A tab favicon renders at 16px, below the mark's legible floor. -->
    <link rel="icon" type="image/png" sizes="16x16" href="/brand/mark-mono-fuchsia-knockout.png" />

    <title>laiive</title>
    <meta name="description" content="ask what is on tonight." />
    <meta name="author" content="laiive" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="laiive" />
    <meta property="og:description" content="ask what is on tonight." />
    <meta property="og:image" content="https://laiive.pages.dev/og-image.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@laiive" />
    <meta name="twitter:title" content="laiive" />
    <meta name="twitter:description" content="ask what is on tonight." />
    <meta name="twitter:image" content="https://laiive.pages.dev/og-image.png" />

    <!-- The lockup is on every screen and <Mark> renders it as soon as React
         paints, so without this it is fetched a round trip too late and the
         header shows a gap. The icon sprite needs no equivalent: it is inlined
         into the bundle (components/IconSprite.tsx). -->
    <link rel="preload" as="image" href="/brand/mark-fuchsia-alpha.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
