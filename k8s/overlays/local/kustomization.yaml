# For a throwaway cluster (k3d, kind, Docker Desktop) — one replica of
# everything, no ingress, no TLS, gateway reachable on a NodePort. This plus
# docker-compose is the substitute for a staging environment: a second namespace
# on the single prod node would share its failure domain and prove little.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: laiive

resources:
  - ../../base

# Locally the images are built by `docker compose build`, which tags them
# laiive-<svc> with no registry prefix.
images:
  - { name: ghcr.io/ai-safe-earth/laiive-gateway, newName: laiive-gateway, newTag: latest }
  - { name: ghcr.io/ai-safe-earth/laiive-retriever, newName: laiive-retriever, newTag: latest }
  - { name: ghcr.io/ai-safe-earth/laiive-pusher, newName: laiive-pusher, newTag: latest }
  - { name: ghcr.io/ai-safe-earth/laiive-search, newName: laiive-search, newTag: latest }

# Secrets come from the root .env directly here — no SOPS, no age key. This file
# is generated by k8s/scripts/env-to-secret.sh and is gitignored.
secretGenerator:
  - name: laiive-env
    envs:
      - secrets.env

replicas:
  - { name: gateway, count: 1 }
  - { name: retriever, count: 1 }

patches:
  - path: nodeport.yaml
  # The HPA's floor is 2, so it would immediately undo the single-replica patch
  # above. Removed rather than fought with.
  - target:
      kind: HorizontalPodAutoscaler
      name: retriever
    patch: |
      $patch: delete
      apiVersion: autoscaling/v2
      kind: HorizontalPodAutoscaler
      metadata:
        name: retriever
