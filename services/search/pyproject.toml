[project]
name = "search-api"
version = "0.1.0"
description = "Admin-triggered internet event discovery with clean provenance (Phase 5)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.127.1",
    "httpx>=0.27.0",
    "laiive-shared",
    "loguru>=0.7.3",
    "neo4j>=6.0.3",
    "openai>=2.14.0",
    "pydantic-settings>=2.12.0",
    # Shared geocode cache + 1 req/s gate across replicas (laiive_shared.geocode_store).
    "redis>=5.0",
    "uvicorn>=0.40.0",
]

[dependency-groups]
# Flows are thin HTTP clients deployed to Prefect Cloud's managed pool —
# prefect stays out of the service's main dependencies so the API image is slim.
flows = [
    "prefect>=3.1",
    # flows/auth.py loads the root .env directly — pydantic-settings pulls this
    # in anyway, but the flows import it by name, so they declare it.
    "python-dotenv>=1.0",
]
dev = [
    "pytest>=8.0",
    "pytest-timeout>=2.3",
    # pinned to .pre-commit-config.yaml's ruff-pre-commit rev so CI and hooks agree
    "ruff==0.4.9",
    { include-group = "flows" },
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.uv.sources]
laiive-shared = { path = "../shared", editable = true }
