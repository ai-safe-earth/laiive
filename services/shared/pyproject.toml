[project]
name = "laiive-shared"
version = "0.1.0"
description = "Shared contracts (SSE protocol, cards), graph write path, and embedding text builders for laiive services"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.7",
    "neo4j>=6.0.3",
    "httpx>=0.27.0",
    # For the shared probe endpoints and the internal-key middleware. Every
    # consumer service already depends on fastapi, so this adds no wheel.
    "fastapi>=0.115",
    # lat/lng -> IANA timezone, offline. A listing states a wall-clock time and
    # nothing else, so the venue's own zone is the only thing that turns "21:00"
    # into an instant. Country code is not enough: Spain alone spans two zones.
    "timezonefinder>=6.5",
    # zoneinfo reads the IANA database off the OS, and Windows ships none — the
    # dev box here resolves nothing without this. Unconditional rather than
    # platform-gated so the dev box and the Fly images agree on one tz version.
    "tzdata>=2024.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    # pinned to .pre-commit-config.yaml's ruff-pre-commit rev so CI and hooks agree
    "ruff==0.4.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["laiive_shared"]

[tool.pytest.ini_options]
pythonpath = ["."]
