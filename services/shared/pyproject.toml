[project]
name = "laiive-shared"
version = "0.1.0"
description = "Shared contracts (SSE protocol, cards), graph write path, and embedding text builders for laiive services"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.7",
    "neo4j>=6.0.3",
    "httpx>=0.27.0",
    # For the shared probe endpoints and the internal-key middleware. Every
    # consumer service already depends on fastapi, so this adds no wheel.
    "fastapi>=0.115",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["laiive_shared"]

[tool.pytest.ini_options]
pythonpath = ["."]
