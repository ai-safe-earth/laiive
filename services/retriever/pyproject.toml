[project]
name = "retriever"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.127.1",
    "httpx>=0.28.1",
    "langfuse>=3.12.0",
    "loguru>=0.7.3",
    "neo4j>=6.0.3",
    "numpy>=2.4.0",
    "openai>=2.14.0",
    "pydantic-settings>=2.12.0",
    "pytest>=9.0.2",
    "python-dateutil>=2.9.0.post0",
    "requests>=2.32.5",
    "tenacity>=9.1.2",
    "uvicorn>=0.40.0",
]

[dependency-groups]
dev = [
    "pytest-timeout>=2.4.0",
]

[tool.pytest.ini_options]
markers = [
  "integration: marks tests as integration",
]
