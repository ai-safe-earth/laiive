[project]
name = "retriever"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.127.1",
    "httpx>=0.28.1",
    "laiive-shared",
    "langfuse>=3.12.0",
    "loguru>=0.7.3",
    "neo4j>=6.0.3",
    "openai>=2.14.0",
    "pydantic-settings>=2.12.0",
    "python-dateutil>=2.9.0.post0",
    "python-multipart>=0.0.9",
    # only imported when REDIS_URL is set (geocode store for the named-place leg)
    "redis>=5.0",
    "requests>=2.32.5",
    "tenacity>=9.1.2",
    "uvicorn>=0.40.0",
]

[dependency-groups]
dev = [
    # pytest lived in the main dependencies, so `uv sync --no-dev` still shipped
    # it into the production image.
    "pytest>=9.0.2",
    "pytest-timeout>=2.4.0",
    # pinned to .pre-commit-config.yaml's ruff-pre-commit rev so CI and hooks agree
    "ruff==0.4.9",
]

[tool.pytest.ini_options]
markers = [
  "integration: marks tests as integration",
]

[tool.uv.sources]
laiive-shared = { path = "../shared", editable = true }
