[project]
name = "pusher-api"
version = "0.1.0"
description = "Agent to upload events in a multimodal way with human validation to ensure Data quality"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.127.1",
    "httpx>=0.27.0",
    "laiive-shared",
    "loguru>=0.7.3",
    "neo4j>=6.0.3",
    "openai>=2.14.0",
    "pydantic-settings>=2.12.0",
    "pypdf>=5.1.0",
    "python-docx>=1.1.2",
    "python-multipart>=0.0.9",
    # Shared geocode cache + 1 req/s gate across replicas (laiive_shared.geocode_store).
    "redis>=5.0",
    "uvicorn>=0.40.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-timeout>=2.3",
    # pinned to .pre-commit-config.yaml's ruff-pre-commit rev so CI and hooks agree
    "ruff==0.4.9",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.uv.sources]
laiive-shared = { path = "../shared", editable = true }
